# src-tauri: the Tauri 2 app shell. A thin IPC layer only — deletion policy,
# protection checks, and Trash routing all live in mole-core (mirrors the
# "mole is a router only" rule).
[package]
name = "tidy"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tidy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Binary/process name (what ps and Activity Monitor show), capitalized to
# match the product name; cargo package names stay lowercase by convention.
[[bin]]
name = "Tidy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mole-core = { path = "../crates/mole-core" }
mole-macos = { path = "../crates/mole-macos" }
mole-ops = { path = "../crates/mole-ops" }
mole-telemetry = { path = "../crates/mole-telemetry" }
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-drag = "2"
core-foundation = "0.10"
core-graphics = "0.24"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
semver = "1"

# Native status-item drawing, click routing and panel window tweaks. Same
# versions tray-icon/tao already pull in, so no new crates are compiled.
[target.'cfg(target_os = "macos")'.dependencies]
# Must stay the tray-icon minor that tauri uses: `with_inner_tray_icon` hands
# out this crate's TrayIcon type.
tray-icon = { version = "0.24", default-features = false }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry", "NSArray", "NSLocale"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAppearance", "NSAttributedString", "NSButton", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSStringDrawing", "NSView", "NSWindow", "NSAccessibilityProtocols"] }

[dev-dependencies]
tempfile.workspace = true
