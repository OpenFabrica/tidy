<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidy · 清理 · 扫描中 · 方案 A</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="a.css" rel="stylesheet">
</head>
<body>
<header class="mast">
  <div class="mast-row">
    <span class="mast-logo">TIDY</span>
    <nav class="mast-tabs">
      <a class="is-active" href="clean-home.html">清理</a>
      <a href="apps.html">软件</a>
      <a href="optimize.html">优化</a>
      <a href="analyze.html">分析</a>
      <a href="status.html">状态</a>
    </nav>
    <span class="mast-meta"><span class="long">周二 · 11月3日 · </span>20:56</span>
  </div>
  <div class="mast-rules"></div>
</header>

<main class="page">
  <div class="wrap">
    <div class="scan-stage">
      <section class="scan-card">
        <div class="scan-head">
          <span class="scan-ring">
            <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#26241f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19.5 4.5 13 15"></path>
              <path d="M10.2 14.2 16.6 17.8 14.6 25.5 5.5 20.4Z"></path>
              <path d="M8.4 21.4 10.6 18.6"></path>
              <path d="M11.4 23.1 13 20.2"></path>
            </svg>
          </span>
          <div class="scan-titles">
            <span class="scan-stage-label">正在分析中</span>
            <h2 class="scan-title">正在分析可清理内容…</h2>
          </div>
        </div>

        <div class="scan-path">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#8a8578" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 6.5V17a1.5 1.5 0 0 0 1.5 1.5h14a1.5 1.5 0 0 0 1.5-1.5V8.5A1.5 1.5 0 0 0 18 7h-7.5L8.6 4.5H4A1.5 1.5 0 0 0 2.5 6Z"></path>
          </svg>
          <div class="scan-path-body">
            <div class="scan-path-meta"><span>正在扫描</span><span class="mono">12 秒</span></div>
            <div class="path"><span class="path-head">~/Library/Caches/com.</span><span class="path-tail">apple.Safari/WebKitCache</span></div>
          </div>
        </div>

        <div class="activity"></div>

        <div class="tiles">
          <div class="tile"><span class="tile-label">已检查文件</span><span class="tile-val">128,403</span></div>
          <div class="tile"><span class="tile-label">已扫描数据</span><span class="tile-val">42.18GB</span></div>
          <div class="tile"><span class="tile-label">已用时间</span><span class="tile-val">12 秒</span></div>
        </div>

        <p class="scan-hint">若 macOS 弹出授权请求，请选择“允许”或“不允许”；扫描会在你回应后继续</p>

        <a class="btn" href="clean-home.html">取消</a>
      </section>
    </div>
  </div>
</main>
</body>
</html>
