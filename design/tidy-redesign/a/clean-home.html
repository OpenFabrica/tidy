<header class="mast">
  <div class="mast-row">

<main class="page">
  <div class="wrap">
    <div class="front-head">
      <span class="kicker">第 47 期 · 智能清理专栏</span>
      <span class="strap">只清可再生文件 · 全程可预览</span>
    </div>

    <div class="front">
      <div class="front-folio" aria-hidden="true">47</div>

      <div class="front-lead">
        <h1 class="headline">今天的磁盘，<br>值得一次<em>彻底</em>的整理。</h1>
        <div class="byline">
          <span class="byline-rule"></span>
          <span class="byline-desk">本刊编辑部 · 磁盘管理组</span>

        <div class="cta-row">
          <a class="frame-cta" href="clean-scan.html">开始扫描 →</a>
          <span class="cta-note">扫描不改动任何文件</span>
        </div>
      </div>

      <aside class="front-note">
        <span class="front-note-title">编者按</span>
        <p class="standfirst"><span class="dropcap">扫</span>描的对象只有四类：系统缓存、过期日志、下载残留与废纸篓。它们都能由系统重新生成——你的文稿、照片与应用数据，从不在清理之列。</p>
        <div class="double-rule front-stats">
          <div class="double-rule-inner">
            <div class="ledger">
              <div class="lrow"><span class="label">上次清理</span><span class="leader"></span><span class="val">14 天前</span></div>
              <div class="lrow"><span class="label">当期回收</span><span class="leader"></span><span class="val">8.42GB</span></div>

          </div>
        </div>
